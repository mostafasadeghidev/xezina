name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build zips
        env:
          WXT_GDRIVE_CLIENT_ID: ${{ vars.WXT_GDRIVE_CLIENT_ID }}
          WXT_DROPBOX_CLIENT_ID: ${{ vars.WXT_DROPBOX_CLIENT_ID }}
          WXT_ONEDRIVE_CLIENT_ID: ${{ vars.WXT_ONEDRIVE_CLIENT_ID }}
          WXT_GITHUB_CLIENT_ID: ${{ vars.WXT_GITHUB_CLIENT_ID }}
        run: pnpm zip && pnpm zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: xezina-zips
          path: .output/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --title "Xezina $GITHUB_REF_NAME" --generate-notes
